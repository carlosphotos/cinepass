name: Actualizar catálogo global de streaming

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 1 * *'

permissions:
  contents: write

concurrency:
  group: reelstub-streaming-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Actualizar catálogo de las 264 películas (corregido)
        env:
          MOVIE_NIGHT_API_KEY: ${{ secrets.MOVIE_NIGHT_API_KEY }}
        run: python scripts/fetch_streaming_catalog.py

      - name: Guardar catálogo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/streaming-catalog.json
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
            exit 0
          fi
          git commit -m "Actualizar catálogo global de streaming"
          git push
